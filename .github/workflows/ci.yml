name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Guard official base path
        run: |
          grep -q 'basePath: "/osanpo"' next.config.mjs
          if grep -R "shinosanpo" out src public next.config.mjs; then
            echo "Unexpected shinosanpo reference found"
            exit 1
          fi
          grep -q '/osanpo/_next/' out/index.html
          grep -q 'https://nobuja0428.github.io/osanpo/' out/sitemap.xml
          test -f out/courses/koenji-first/index.html
          test -f out/areas/koenji/index.html
          test -f out/sitemap.xml
